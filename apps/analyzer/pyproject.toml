[project]
name = "mailsentinel-analyzer"
version = "0.1.0"
description = "Private MailSentinel analysis service foundation"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2", "dramatiq[redis]>=1.17,<2", "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3", "redis>=5,<6", "uvicorn[standard]>=0.34,<1"
]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "httpx>=0.28,<1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"
