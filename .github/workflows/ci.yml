name: CI
on:
  pull_request:
  push:
    branches: [integration, main]
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mailsentinel:mailsentinel@localhost:5432/mailsentinel
      BETTER_AUTH_SECRET: ci-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      ANALYZER_INTERNAL_URL: http://127.0.0.1:8000
      ANALYZER_SERVICE_TOKEN: ci-analyzer-service-token
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: mailsentinel-evidence
      S3_ACCESS_KEY_ID: mailsentinel
      S3_SECRET_ACCESS_KEY: ci-storage-secret-value
      S3_FORCE_PATH_STYLE: "true"
      APP_ENV: test
      WEB_DATA_MODE: fixture
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: mailsentinel, POSTGRES_USER: mailsentinel, POSTGRES_DB: mailsentinel}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailsentinel -d mailsentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.6.14", enable-cache: true}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: uv sync --locked
        working-directory: apps/analyzer
      - run: pnpm env:check
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm contracts:check
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm --filter @mailsentinel/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mailsentinel/web test:e2e
      - run: pnpm audit --audit-level high
      - run: docker build -t mailsentinel-analyzer:ci apps/analyzer
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: mailsentinel-analyzer:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Start private service stack
        run: docker compose -f infra/compose.yaml up -d --build --wait postgres redis minio analyzer worker
      - name: Exercise protected intake and worker consumption
        run: |
          set -euo pipefail
          compose="docker compose -f infra/compose.yaml"
          $compose exec -T analyzer python -c "import urllib.request; response = urllib.request.urlopen('http://localhost:8000/health/ready'); assert response.status == 200"
          $compose stop worker
          $compose exec -T analyzer python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = "http://localhost:8000/v1/analyses"
          payload = {
              "caseId": "case_ci",
              "organizationId": "org_ci",
              "analysisRunId": "run_ci",
              "artifact": {
                  "objectKey": "organizations/org_ci/cases/case_ci/artifacts/artifact_ci.eml",
                  "sha256": "a" * 64,
                  "byteSize": 42,
              },
              "requestedAt": "2026-01-01T00:00:00Z",
          }

          try:
              urllib.request.urlopen(
                  urllib.request.Request(
                      endpoint,
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json"},
                  )
              )
          except urllib.error.HTTPError as error:
              assert error.code == 401, error
          else:
              raise AssertionError("analyzer accepted an unauthenticated request")

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['ANALYZER_SERVICE_TOKEN']}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              assert response.status == 202, response.status
          PY
          queued="$($compose exec -T redis redis-cli llen dramatiq:analysis | tr -d '\r')"
          test "$queued" -gt 0
          $compose start worker
          for _ in $(seq 1 30); do
            queued="$($compose exec -T redis redis-cli llen dramatiq:analysis | tr -d '\r')"
            if test "$queued" -eq 0; then
              exit 0
            fi
            sleep 1
          done
          echo "worker did not consume the setup job" >&2
          exit 1
      - name: Stop service stack
        if: always()
        run: docker compose -f infra/compose.yaml down --volumes --remove-orphans
