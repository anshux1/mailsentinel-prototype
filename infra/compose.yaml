name: mailsentinel

x-analyzer-environment: &analyzer-environment
  APP_ENV: development
  DATABASE_URL: postgresql://mailsentinel:mailsentinel@postgres:5432/mailsentinel
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: mailsentinel-evidence
  S3_ACCESS_KEY_ID: mailsentinel
  S3_SECRET_ACCESS_KEY: mailsentinel-local-secret
  S3_FORCE_PATH_STYLE: "true"
  ANALYZER_SERVICE_TOKEN: local-development-token-change-me
  ENRICHMENT_MODE: fixture

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mailsentinel
      POSTGRES_PASSWORD: mailsentinel
      POSTGRES_DB: mailsentinel
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailsentinel -d mailsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mailsentinel
      MINIO_ROOT_PASSWORD: mailsentinel-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 mailsentinel mailsentinel-local-secret && mc mb --ignore-existing local/mailsentinel-evidence && mc anonymous set none local/mailsentinel-evidence"]
  analyzer:
    build: ../apps/analyzer
    environment: *analyzer-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: ../apps/analyzer
    command: ["uv", "run", "dramatiq", "app.tasks.broker"]
    environment: *analyzer-environment
    depends_on:
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  minio-data:
